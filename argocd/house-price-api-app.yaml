apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: house-price-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sofGitAdmin/mlops-house-price.git
    targetRevision: main
    path: helm/house-price-api

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true